name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A new run on a PR (a push or a body edit) cancels the one in progress. No job skips on a title-only edit: a skipped
# required check counts as passing, so a title edit after a red run would allow the merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (incluye el chequeo de rutas personales y de copias compartidas)
        run: npm test
      - name: global --dry-run en un HOME temporal
        run: |
          export ORCA_STACK_HOME="$(node -p "require('fs').mkdtempSync(require('path').join(require('os').tmpdir(), 'orca-stack-ci-'))")"
          node bin/orca-stack.mjs global --dry-run --skip-pi
          test -z "$(ls -A "$ORCA_STACK_HOME")" || { echo "el dry-run escribió archivos"; exit 1; }
      - name: init --dry-run en un repo temporal
        run: |
          export ORCA_STACK_HOME="$(node -p "require('fs').mkdtempSync(require('path').join(require('os').tmpdir(), 'orca-stack-ci-'))")"
          repo="$(node -p "require('fs').mkdtempSync(require('path').join(require('os').tmpdir(), 'orca-stack-repo-'))")"
          git init -q "$repo"
          (cd "$repo" && node "$GITHUB_WORKSPACE/bin/orca-stack.mjs" init --dry-run)
          test -z "$(ls -A "$repo" | grep -v '^.git$' || true)" || { echo "init --dry-run escribió archivos"; exit 1; }

  hygiene:
    name: Commits and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conventional Commits on every commit of the PR
        if: github.event_name == 'pull_request'
        run: node scripts/check-commits.mjs "origin/${{ github.base_ref }}" HEAD
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evidencia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current PR body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api repos/$GITHUB_REPOSITORY/pulls/$PR --jq .body > "$RUNNER_TEMP/pr-body.md"
      - name: Check test names in PR evidence
        if: github.event_name == 'pull_request'
        run: node scripts/check-evidencia.mjs "$RUNNER_TEMP/pr-body.md"

  ci-ok:
    name: ci-ok
    needs:
      - test
      - hygiene
      - evidencia
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every CI job to succeed
        env:
          ORCA_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-ok.mjs
